services:
  ollama:
    image: ollama/ollama:latest
    container_name: interview_kb_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scrapes ingest-app's /actuator/prometheus. ingest-app itself is NOT containerized — keep
  # running it on the host via `mvn -pl ingest-app spring-boot:run` (port 8081); Docker Desktop's
  # host.docker.internal resolves back to it from inside this compose network.
  prometheus:
    image: prom/prometheus:latest
    container_name: interview_kb_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Pre-provisioned with a Prometheus datasource + the "Ingest Jobs" dashboard (active job status,
  # processed/skipped/failed rates, LLM call duration, token usage) — see observability/grafana/.
  grafana:
    image: grafana/grafana:latest
    container_name: interview_kb_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  ollama_data:
